name: Release archive

# On a version tag, next to the Docker image (docker.yml): the bundle with a
# Node.js binary, as one linux-amd64 archive attached to the GitHub release.
# This is what the README's "Run it next to a homeserver" downloads.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # Builds with a read-only token: dependencies' install scripts and the build
  # run here, and none of them needs to write to the repository.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # The archive is named after the tag; a tag that does not match the
      # version in package.json would publish a misnamed one.
      - name: Check the tag against package.json
        run: test "v$(node --print "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Build the bundle
        run: npm run bundle

      - name: Pack the archive and smoke-test it
        run: |
          archive="$(scripts/release-archive.sh "${GITHUB_REF_NAME#v}" release)"
          scripts/smoke-test-archive.sh "$archive"

      - name: Hand the archive to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: release-archive
          path: release/*.tar.gz
          if-no-files-found: error

  # The only job that may write: it attaches what the build job produced.
  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Fetch the archive
        uses: actions/download-artifact@v8
        with:
          name: release-archive
          path: release

      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/*.tar.gz --clobber
